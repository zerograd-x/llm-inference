[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-inference"
version = "0.1.0"
description = "Backend-neutral inference runtime for decoder-only language models."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
transformers = [
  "accelerate>=1,<2",
  "torch>=2.4",
  "transformers>=4.48,<6",
]
vllm = [
  "vllm>=0.8",
]
test = [
  "pytest>=8,<9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
